name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Susun proyek (hanya jika belum ada)
        run: |
          if [ ! -d app ]; then
            echo '' | base64 -d | tar xz
            echo "NEW_PROJECT=1" >> $GITHUB_ENV
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenRec-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Simpan kode proyek ke repositori
        if: env.NEW_PROJECT == '1'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A -- . ':!app/build' ':!build' ':!.gradle'
          git commit -m "Tambah kode proyek ScreenRec" || true
          git push
